# ============================================================================
# NOTTA-POS Continuous Integration
# ============================================================================
# WHAT: Runs the backend test suite and a frontend build + test on GitHub's
#       servers every time a pull request is opened or updated, and on every
#       push to main.
# WHY:  A pull request shows a green check or a red X before it is merged, so
#       broken code is caught without anyone having to run the tests by hand.
# ============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when a newer commit is pushed to the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: this workflow never needs to write to the repository
permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Backend: Spring Boot unit, controller, and repository tests
  # --------------------------------------------------------------------------
  backend:
    name: Backend tests (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Java 21 matches <java.version> in backend/pom.xml.
      # "cache: maven" saves downloaded dependencies between runs.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Repository tests use Testcontainers, which starts a real PostgreSQL 16
      # container. GitHub's Ubuntu runners have Docker pre-installed.
      - name: Run backend tests
        run: mvn -B test

  # --------------------------------------------------------------------------
  # Frontend: lint, production build (Vite), and tests (Vitest)
  # --------------------------------------------------------------------------
  frontend:
    name: Frontend build and tests (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # "npm ci" installs exactly what package-lock.json specifies
      - name: Install dependencies
        run: npm ci

      # Lint: mistakes a program can spot by reading the code (an unused import,
      # a hook called inside an "if"). Any warning fails this step, so sloppy
      # code fails here instead of shipping. Create React App used to do this
      # inside its build; Vite's build does not lint, so it is its own step.
      # The rules are in frontend/eslint.config.js.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # "npm test" runs every test once and exits (vitest run)
      - name: Run tests
        run: npm test
