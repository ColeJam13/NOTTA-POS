# ============================================================================
# Notta-POS Application Configuration
# ============================================================================

# Application Info
spring.application.name=Notta-POS
server.port=8080

# Addresses the frontend may be opened from (comma-separated). A browser on any
# other address is refused by the backend. Add the tablet-facing address here,
# for example: http://localhost:3000,http://192.168.1.50:3000
notta.cors.allowed-origins=http://localhost:3000

# Sales tax as a decimal (0.03 = 3%). The backend uses this to work out every
# check (OrderCheckService). The order screen shows a running total before
# anything is saved, using its own copy of this number: TAX_RATE in
# frontend/src/utils/totals.js. Change both together.
notta.tax-rate=0.03

# ============================================================================
# Local settings (not in git)
# ============================================================================

# Reads backend/application-local.properties if it exists. "optional:" means the
# app still starts when the file is not there. Anything set in that file wins
# over the same setting in this one. The path is relative to the folder the
# backend is started from (backend/).
spring.config.import=optional:file:./application-local.properties

# ============================================================================
# Database Configuration - PostgreSQL
# ============================================================================

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/notta_pos?sslmode=disable
spring.datasource.username=nottauser
# The password is NOT kept in this file, because this file is in git and anyone
# who can see the repository could read it. It comes from one of two places:
#   1. backend/application-local.properties - a file that exists only on your computer
#      (git ignores it). Copy application-local.properties.example to make one.
#   2. the NOTTA_DB_PASSWORD environment variable - used on a server, where settings
#      are handed to the app from outside.
spring.datasource.password=${NOTTA_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=false

# Validation (@NotNull, @NotBlank on entities) runs once, at the API boundary,
# when a controller parameter is marked @Valid. "none" stops Hibernate from
# running the same checks a second time every time an entity is saved.
spring.jpa.properties.jakarta.persistence.validation.mode=none

# PostgreSQL-specific settings
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ============================================================================
# Logging Configuration
# ============================================================================

# Application Logging
logging.level.com.notapos=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================================================
# DevTools Configuration (Hot Reload)
# ============================================================================

spring.devtools.restart.enabled=true

# ============================================================================
# HikariCP Connection Pool Configuration (OPTIMIZED FOR PERFORMANCE)
# ============================================================================

# Connection Pool Settings
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.pool-name=NotaPosPool

# Connection Validation
spring.datasource.hikari.connection-test-query=SELECT 1

# Pool Initialization
spring.datasource.hikari.initialization-fail-timeout=0

# PostgreSQL Driver Properties (PERFORMANCE TUNING)
spring.datasource.hikari.data-source-properties.socketTimeout=10
spring.datasource.hikari.data-source-properties.loginTimeout=2
spring.datasource.hikari.data-source-properties.connectTimeout=2
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true