<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Notta-POS - Restaurant Point of Sale System" />
  <link rel="apple-touch-icon" href="/logo192.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- No fonts are fetched from the internet: they ship with the app (src/templates/fonts.css). -->

  <!-- THE TEMPLATE (the look of every screen), set before anything is drawn.
       The app learns which template the restaurant uses from the backend, but only once
       someone has signed in. This device remembers the last answer, and this line puts
       it on the page straight away, so the PIN pad is already in the right look and the
       screen does not flash from one look to another while the app starts.
       src/templates/index.js writes the remembered name and explains the rest.
       A name no stylesheet knows changes nothing: the page is drawn in the default. -->
  <script>
    try {
      document.documentElement.setAttribute('data-template', window.localStorage.getItem('notta.template') || '8-bit');
    } catch (error) {
      document.documentElement.setAttribute('data-template', '8-bit');      // Storage is switched off in this browser
    }
  </script>

  <title>Notta-POS</title>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <!-- Where the app starts. Vite reads this page first and follows this line to the code;
       Create React App added the equivalent line by itself, out of sight. type="module"
       lets the file use "import". -->
  <script type="module" src="/src/index.jsx"></script>
</body>
</html>
